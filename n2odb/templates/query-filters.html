{% extends 'base.html' %}
{% block title %}Explore Data | GRAND Explorer{% endblock %}
{% block head %}{% endblock %}
{% block content %}



    <!-- content
    ================================================== -->
    <section class="s-content">

        <div class="row">
            <div class="column large-12">

                <article class="s-content__entry">

                    <div class="s-content__entry-header">
                        <h1 class="s-content__title">Which features are you interested in filtering by?</h1>
                        <p class="s-content__meta" style="text-align: center; font-size: 2.2rem; font-family: 'Times New Roman', Times, serif; ">
                            <span>(Select as many as you like)</span>
                        </p>
                    </div> <!-- end s-content__entry-header -->

                    <div class="s-content__primary">

                        <div class="s-content__page-content" style="text-align: center;">

                            <button id="ins" type="button" class="btn btn-secondary" style="background-color:#aab0b5" onclick="setColor(this)">Flux Instrument</button>
                            <button id="env" type="button" class="btn btn-secondary" style="background-color:#aab0b5" onclick="setColor(this)">Environmental Data</button>
                            <button id="crop" type="button" class="btn btn-secondary" style="background-color:#aab0b5" onclick="setColor(this)">Crop</button>
                            <button id="mgmt" type="button" class="btn btn-secondary" style="background-color:#aab0b5" onclick="setColor(this)">Sustainable Management</button>
                            <button id="fert" type="button" class="btn btn-secondary" style="background-color:#aab0b5" onclick="setColor(this)">Fertilizer Type</button>
                            <button id="soil" type="button" class="btn btn-secondary" style="background-color:#aab0b5" onclick="setColor(this)">Soil Measurements</button>
                            <button id="texture" type="button" class="btn btn-secondary" style="background-color:#aab0b5" onclick="setColor(this)">Soil Texture</button>
                            <button id="cont" type="button" class="btn btn-secondary" style="background-color:#aab0b5" onclick="setColor(this)">Continent</button>
                            <button id="country" type="button" class="btn btn-secondary" style="background-color:#aab0b5" onclick="setColor(this)">Country</button>


                            <br>
                            <br>
                            <br>
                            <br>
                            <br>

                            <button id="submit" type="button" class="btn btn-outline-primary btn-lg" onclick="getSelected()">Submit</button>
                        </div> <!-- end s-entry__page-content -->

                    </div> <!-- end s-content__primary -->
                </article> <!-- end entry -->

            </div> <!-- end column -->
        </div> <!-- end row -->

    </section> <!-- end s-content -->

<form id="selectedForm" method="POST" action="/get-data/">
  {% csrf_token %}
  <input type="hidden" name="selected" value=""/>
</form>

<script>
    function setColor(btn) {
        console.log("running")
        console.log(btn.style.backgroundColor)
        if (btn.style.backgroundColor == "#aab0b5") {
            btn.style.backgroundColor = "#82968c"
            console.log("color changed")
        }
        else if (btn.style.backgroundColor == "rgb(170, 176, 181)") {  
            btn.style.backgroundColor = "#82968c"
            console.log("color changed")
        }
        else {
            btn.style.backgroundColor = "#aab0b5"
            console.log("color not changed")
        }
    }
</script>

<script>
    function getSelected() {
        btn = document.getElementById("submit")
        btn.style.backgroundColor = "#007bff"

        ins = document.getElementById("ins")
        env = document.getElementById("env")
        mgmt = document.getElementById("mgmt")
        fert = document.getElementById("fert")
        crop = document.getElementById("crop")
        cont = document.getElementById("cont")
        country = document.getElementById("country")
        soil = document.getElementById("soil")
        texture = document.getElementById("texture")

        var selected = []
        if (ins.style.backgroundColor == "rgb(130, 150, 140)") {
            selected = selected.concat("ins")
        }
        if (mgmt.style.backgroundColor == "rgb(130, 150, 140)") {
            selected = selected.concat("mgmt")
        }
        if (fert.style.backgroundColor == "rgb(130, 150, 140)") {
            selected = selected.concat("fert")
        }
        if (crop.style.backgroundColor == "rgb(130, 150, 140)") {
            selected = selected.concat("crop")
        }
        if (cont.style.backgroundColor == "rgb(130, 150, 140)") {
            selected = selected.concat("cont")
        }
        if (country.style.backgroundColor == "rgb(130, 150, 140)") {
            selected = selected.concat("country")
        }
        if (env.style.backgroundColor == "rgb(130, 150, 140)") {
            selected = selected.concat("env")
        }
        if (soil.style.backgroundColor == "rgb(130, 150, 140)") {
            selected = selected.concat("soil")
        }
        if (texture.style.backgroundColor == "rgb(130, 150, 140)") {
            selected = selected.concat("texture")
        }
        console.log(selected)

        var selectedForm = document.forms['selectedForm'];
        selectedForm.elements["selected"].value = selected;
        document.getElementById("selectedForm").submit()
    }
</script>


{% endblock %}
