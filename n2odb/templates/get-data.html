    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    // Does this cookie string begin with the name we want?
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>

<script>
    (async () => {
      const topology = await fetch(
        'https://code.highcharts.com/mapdata/custom/world-highres.topo.json'
      ).then(response => response.json());

      var siteData = JSON.parse("{{json_site|escapejs}}")
      console.log(siteData)

      sitePoints = []
      for (let i = 0; i < siteData.length; i++) {
        dict = {};

        dict['lat'] = siteData[i]['Latitude']
        dict['lon'] = siteData[i]['Longitude']
        dict['title'] = siteData[i]['Longitude']
        dict['map'] = siteData[i]['MAP']
        dict['mat'] = siteData[i]['MAT']
        sitePoints.push(dict)
      }
      console.log(sitePoints)

      // Wrap point.select to get to the total selected points
      Highcharts.wrap(Highcharts.Point.prototype, 'select', function (proceed) {
        proceed.apply(this, Array.prototype.slice.call(arguments, 1));
        const points = this.series.chart.getSelectedPoints();
        if (points.length) {
          if (points.length === 1) {
            document.querySelector('#info h2').innerHTML = "<h1 style='margin-top:0 !important' >Site Information</h1><br>";
            document.querySelector('#info .subheader').innerHTML = points[0].title;
            document.querySelector('#info .subheader').innerHTML = "<h2>Mean Annual Precipitation: " + points[0].map +
                " mm</h2><br><h2>Mean Annual Temperature: " + points[0].mat + " C</h2>"
          }

        }
      });

      // Initiate the map chart
      window.mapChart = Highcharts.mapChart('container', {
        chart: {
            map: topology
        },
        title: {
          text: 'Research Sites Included in Query'
        },
        mapNavigation: {
          enabled: true,
          buttonOptions: {
            verticalAlign: 'bottom'
          }
        },
        accessibility: {
            point: {
                valueDescriptionFormat: '{xDescription}. Lat: {point.lat:.2f}, lon: {point.lon:.2f}.'
            }
        },
        tooltip: {
            headerFormat: '',
            pointFormat: '<b>{point.name}</b><br>Lat: {point.lat}, Lon: {point.lon}'
        },
        colorAxis: {
          type: 'logarithmic',
          endOnTick: false,
          startOnTick: false,
          min: 50000
        },
        series: [{
          name: 'Sites',
            borderColor: '#A0A0A0',
            nullColor: 'rgba(200, 200, 200, 0.3)',
            showInLegend: false
        }, {
            name: 'Separators',
            type: 'mapline',
            nullColor: '#707070',
            showInLegend: false,
            enableMouseTracking: false,
            accessibility: {
                enabled: false
            }
        }, {
            // Specify points using lat/lon
            color: Highcharts.getOptions().colors[1],
            type: 'mappoint',
            name: 'Cities',
            accessibility: {
                point: {
                    valueDescriptionFormat: '{xDescription}. Lat: {point.lat:.2f}, lon: {point.lon:.2f}.'
                }
            },
          data: sitePoints,
          allowPointSelect: true,
          cursor: 'pointer',
          borderWidth: 0.5
        }]
      });
    })();
</script>
