services:
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    volumes:
      # Named Docker volume (managed under /var/lib/docker/volumes), NOT a bind
      # mount into the repo. This keeps the live InnoDB datadir out of the git
      # working tree so no git/file op can ever delete it (see the July 2026
      # incident). Named volumes are SELinux-labelled by Docker automatically, so
      # no `:Z` is needed here (that was only required for the host bind mount).
      - mysql_data:/var/lib/mysql
    env_file:
      - ../.env
    networks:
      # `default` keeps app<->db working; `n2o_net` lets the separate
      # DorichScraper ETL container reach this DB as host `db`.
      - default
      - n2o_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ..
    #working_dir: /workspaces/fluxapp
    command: sleep infinity
    #command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ..:/workspaces/fluxapp:Z
    ports:
      - "8001:8000"
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:

networks:
  # Shared cross-project network referenced as EXTERNAL by BOTH this project and
  # the DorichScraper compose, so neither tries to own/label it (that mismatch
  # causes the "network n2o_net has incorrect label" rebuild error). Create it
  # once, out-of-band, before bringing either project up:
  #     docker network create n2o_net
  n2o_net:
    external: true
    name: n2o_net